name: ARES verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ares-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platforms/shared/package-lock.json
            platforms/ui-tools/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Prepare owned evidence folder
        run: |
          $testRoot=Join-Path $env:RUNNER_TEMP 'ares-evidence'
          $browserRoot=Join-Path $env:RUNNER_TEMP 'ares-browsers'
          "ARES_TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
          "PLAYWRIGHT_BROWSERS_PATH=$browserRoot" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
      - name: Install pinned JavaScript dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix platforms/shared --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix platforms/ui-tools --ignore-scripts --no-audit --no-fund
          exit $LASTEXITCODE
      - name: Install pinned Python test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Install media tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y ffmpeg
          exit $LASTEXITCODE
      - name: Ensure media tools on Windows
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Command ffprobe -ErrorAction Stop | Out-Null
      - name: Install headless Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Core business tests
        run: npm test
      - name: Python quality and data provenance
        run: |
          npm run test:quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_rubrics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_rubric_sources.py --report (Join-Path $env:ARES_TEST_ROOT 'rule-source-status.json')
          exit $LASTEXITCODE
      - name: Reproducible generated assets and receipts
        run: |
          node scripts/build_forge.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build_portable_ui.mjs --check
          exit $LASTEXITCODE
      - name: Full serial regression, browser, MCP, packaging, permissions and recovery
        run: |
          node --test --test-concurrency=1 --test-reporter=tap tests/*.test.mjs | Tee-Object -FilePath (Join-Path $env:ARES_TEST_ROOT 'node-tests.tap')
          exit $LASTEXITCODE
      - name: Upload actual test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ares-evidence-${{ matrix.os }}
          # Keep test homes, owner keys and raw project stores out of artifacts.
          path: |
            ${{ runner.temp }}/ares-evidence/node-tests.tap
            ${{ runner.temp }}/ares-evidence/rule-source-status.json
            ${{ runner.temp }}/ares-evidence/**/evidence.json
            ${{ runner.temp }}/ares-evidence/**/*-evidence.json
            ${{ runner.temp }}/ares-evidence/**/*.png
            ${{ runner.temp }}/ares-evidence/**/*.capture.json
          retention-days: 7
